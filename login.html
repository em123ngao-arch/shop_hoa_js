<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Tiệm Hoa Kẽm Nhung</title>

    <link rel="icon" type="image/png" href="./images/favicon-flower.png" />
    <link rel="apple-touch-icon" href="./images/favicon-flower.png" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/responsive.css" />

    <script type="importmap">
  {
    "imports": {
      "axios": "https://esm.sh/axios@1.7.9"
    }
  }
  </script>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand-header">
                <a href="./index.html" title="Quay về trang chủ Tiệm Hoa Kẽm Nhung">
                    <img src="./images/logo-tiem-hoa.png" alt="Tiệm Hoa Kẽm Nhung" class="auth-brand-logo-img"
                        width="168" height="46" />
                </a>
            </div>
            <h1 class="auth-title">Chào Mừng Trở Lại</h1>
            <p class="auth-subtitle">Đăng nhập để theo dõi đơn hàng của bạn</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Tài khoản đăng nhập</label>
                    <input type="text" id="email" class="form-control"
                        placeholder="Nhập email (ví dụ: admin@shophoa.example)..." autocomplete="username" />
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" />
                    <span class="form-error" id="passwordError"></span>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">Đăng Nhập</button>

                <div class="demo-login-box" style="margin-top: 16px; padding-top: 12px; border-top: 1px dashed #E8E8E8; text-align: center;">
                    <p style="font-size: 12px; color: #71717A; margin-bottom: 8px;">Tài khoản thử nghiệm đồ án:</p>
                    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                        <button type="button" class="btn-demo-fill" data-email="admin@shophoa.example" data-pass="admin123" style="padding: 4px 10px; font-size: 11px; border: 1px solid #E8E8E8; background: #FAFAFA; border-radius: 4px; cursor: pointer; color: #181318;">Quản trị (Admin)</button>
                        <button type="button" class="btn-demo-fill" data-email="staff@shophoa.example" data-pass="123456" style="padding: 4px 10px; font-size: 11px; border: 1px solid #E8E8E8; background: #FAFAFA; border-radius: 4px; cursor: pointer; color: #181318;">Kế toán (Staff)</button>
                        <button type="button" class="btn-demo-fill" data-email="customer1@shophoa.example" data-pass="123456" style="padding: 4px 10px; font-size: 11px; border: 1px solid #E8E8E8; background: #FAFAFA; border-radius: 4px; cursor: pointer; color: #181318;">Khách hàng</button>
                    </div>
                </div>

                <p class="auth-switch">
                    Chưa có tài khoản? <a href="./register.html">Đăng ký tài khoản mới</a>
                </p>
                <p class="auth-switch" style="margin-top: 10px;">
                    <a href="./index.html" style="color: var(--text-muted); font-size: 13px;">← Quay về Trang chủ</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>

</html>
