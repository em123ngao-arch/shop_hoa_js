<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sản phẩm hoa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>QUẢN LÝ SẢN PHẨM HOA</h1>

        <p class="description">
            Danh sách sản phẩm được lấy từ JSON Server
        </p>

        <div class="actions">
            <!-- input  để gắn file vào -->
            <input type="file" id="fileExcel" accept=".xlsx, .xls" hidden>
            <button id="btnImportExcel">
               Import Excel
            </button>

            <button id="btnXuatPDF">
                Xuất file PDF
            </button>

        </div>

        <p id="thongBao"></p>

        <table>

            <thead>
                <tr>
                    <th>STT</th>
                    <th>Tên sản phẩm</th>
                    <th>Loại hoa</th>
                    <th>Giá bán</th>
                    <th>Số lượng</th>
                </tr>
            </thead>

            <tbody id="danhSachSanPham">

                <tr>
                    <td colspan="5">
                        Chưa có dữ liệu
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@3.0.3/dist/jspdf.umd.min.js"></script>

    <!-- jsPDF AutoTable -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.2/dist/jspdf.plugin.autotable.min.js"></script>
    <!-- excel -->

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- JavaScript của chúng ta -->
    <script src="app.js"></script>

</body>

</html>
