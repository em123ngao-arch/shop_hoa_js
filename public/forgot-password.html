<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Quên mật khẩu - Tiệm Hoa Kẽm Nhung</title>
    <link rel="icon" type="image/png" href="./images/favicon-flower.webp" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
    <main class="auth-wrapper">
        <section class="auth-card" aria-labelledby="forgotTitle">
            <div class="auth-brand-header"><a href="./index.html"><img src="./images/logo-tiem-hoa.webp" alt="Tiệm Hoa Kẽm Nhung" class="auth-brand-logo-img" width="168" height="46" /></a></div>
            <h1 class="auth-title" id="forgotTitle">Khôi phục mật khẩu</h1>
            <p class="auth-subtitle">Nhập email tài khoản. Nếu email tồn tại, tiệm sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="email">Địa chỉ email</label>
                    <input id="email" class="form-control" type="email" autocomplete="email" required />
                    <span class="form-error" id="emailError" aria-live="polite"></span>
                </div>
                <button class="auth-btn" id="forgotSubmitBtn" type="submit">Gửi hướng dẫn</button>
                <p class="auth-switch"><a href="./login.html">Quay lại đăng nhập</a></p>
            </form>
            <p id="forgotResult" class="auth-subtitle" role="status" hidden></p>
            <p id="forgotLoginLink" class="auth-switch" hidden><a href="./login.html">Quay lại đăng nhập</a></p>
        </section>
    </main>
    <script type="module" src="./js/forgot-password.js"></script>
</body>
</html>
