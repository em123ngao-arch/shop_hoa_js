<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Tiệm Hoa Kẽm Nhung</title>

    <link rel="icon" type="image/png" href="./images/favicon-flower.png" />
    <link rel="apple-touch-icon" href="./images/favicon-flower.png" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/responsive.css" />

    <script type="importmap">
  {
    "imports": {
      "axios": "./vendor/axios.esm.js"
    }
  }
  </script>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand-header">
                <a href="./index.html" title="Quay về trang chủ Tiệm Hoa Kẽm Nhung">
                    <img src="./images/logo-tiem-hoa.png" alt="Tiệm Hoa Kẽm Nhung" class="auth-brand-logo-img"
                        width="168" height="46" />
                </a>
            </div>
            <h1 class="auth-title">Chào Mừng Trở Lại</h1>
            <p class="auth-subtitle">Đăng nhập để theo dõi đơn hàng của bạn</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Tài khoản đăng nhập</label>
                    <input type="text" id="email" class="form-control"
                        placeholder="Nhập email (ví dụ: admin@shophoa.example)..." autocomplete="username" />
                    <span class="form-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-field">
                        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="current-password" />
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <div class="auth-options">
                    <label class="remember-option" for="rememberMe"><input type="checkbox" id="rememberMe" /> Ghi nhớ đăng nhập</label>
                    <a href="./forgot-password.html">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">Đăng Nhập</button>


                <p class="auth-switch">
                    Chưa có tài khoản? <a href="./register.html">Đăng ký tài khoản mới</a>
                </p>
                <p class="auth-switch" style="margin-top: 10px;">
                    <a href="./index.html" style="color: var(--text-muted); font-size: 13px;">← Quay về Trang chủ</a>
                </p>
            </form>
        </div>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>

</html>
