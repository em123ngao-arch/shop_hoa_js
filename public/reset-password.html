<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Đặt lại mật khẩu - Tiệm Hoa Kẽm Nhung</title>
    <link rel="icon" type="image/png" href="./images/favicon-flower.png" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
    <main class="auth-wrapper">
        <section class="auth-card" aria-labelledby="resetTitle">
            <div class="auth-brand-header"><a href="./index.html"><img src="./images/logo-tiem-hoa.png" alt="Tiệm Hoa Kẽm Nhung" class="auth-brand-logo-img" width="168" height="46" /></a></div>
            <h1 class="auth-title" id="resetTitle">Đặt lại mật khẩu</h1>
            <p class="auth-subtitle" id="resetStatus">Tạo mật khẩu mới cho tài khoản của bạn.</p>
            <form id="resetPasswordForm" novalidate>
                <div class="form-group">
                    <label for="password">Mật khẩu mới</label>
                    <div class="password-field">
                        <input id="password" class="form-control" type="password" autocomplete="new-password" minlength="8" required />
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
                    </div>
                    <span class="form-error" id="passwordError" aria-live="polite"></span>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                    <div class="password-field">
                        <input id="confirmPassword" class="form-control" type="password" autocomplete="new-password" minlength="8" required />
                        <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
                    </div>
                    <span class="form-error" id="confirmPasswordError" aria-live="polite"></span>
                </div>
                <button class="auth-btn" id="resetSubmitBtn" type="submit">Cập nhật mật khẩu</button>
            </form>
            <p class="auth-switch" id="resetNavigation">
                <a href="./login.html">Quay lại đăng nhập</a>
                <span aria-hidden="true"> · </span>
                <a href="./forgot-password.html">Yêu cầu liên kết mới</a>
            </p>
        </section>
    </main>
    <script type="module" src="./js/reset-password.js"></script>
</body>
</html>
