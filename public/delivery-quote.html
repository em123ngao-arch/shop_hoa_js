<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#108474">
  <title>Báo giá giao hàng | Tiệm Hoa Kẽm Nhung</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body{background:#f9fafb;color:#181318;font-family:Arial,sans-serif;padding:28px 14px}
    .quote-page{max-width:620px;margin:30px auto;background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:26px;box-shadow:0 12px 35px rgba(24,19,24,.08)}
    .quote-page h1{font-family:Georgia,serif;font-size:27px;margin:0 0 8px}
    .quote-page p{line-height:1.55;color:#59616d}
    .quote-form{display:grid;gap:12px;margin-top:20px}
    .quote-form label{display:grid;gap:6px;font-size:13px;font-weight:600}
    .quote-form input{width:100%;padding:12px;border:1px solid #d6dbe1;border-radius:8px;font:inherit}
    .quote-button{border:0;border-radius:8px;background:#108474;color:white;padding:12px 16px;font-weight:700;cursor:pointer}
    .quote-button:disabled{opacity:.55;cursor:wait}
    .quote-result{margin-top:18px;padding:16px;border:1px solid #e8e8e8;border-radius:10px}
    .quote-error{color:#b42318;background:#fef3f2;border:1px solid #fecdca;padding:10px;border-radius:8px}
    .quote-details{display:grid;gap:9px;margin:14px 0}
    .quote-detail{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #eef0f2;padding-bottom:8px}
    .payment-choice{display:grid;gap:8px;margin:16px 0}
    .payment-choice label{display:flex;gap:9px;align-items:flex-start;padding:11px;border:1px solid #e8e8e8;border-radius:8px}
    .quote-qr{display:block;width:240px;max-width:100%;margin:14px auto;border:1px solid #e8e8e8;border-radius:8px}
    .quote-muted{font-size:12px;color:#68717d}
    @media(max-width:540px){.quote-page{padding:20px}.quote-page h1{font-size:23px}}
  </style>
</head>
<body>
  <main class="quote-page">
    <a href="./index.html" style="color:#108474;font-weight:700;text-decoration:none;">Tiệm Hoa Kẽm Nhung</a>
    <h1 style="margin-top:16px;">Báo giá giao hàng</h1>
    <p>Nhập mã yêu cầu và số điện thoại người đặt để xem kết quả. Báo giá có hạn; khung giờ chỉ được xác nhận sau khi tiệm kiểm tra lịch.</p>
    <form id="deliveryQuoteLookupForm" class="quote-form">
      <label>Mã yêu cầu<input id="deliveryQuoteCode" autocomplete="off" maxlength="20" required></label>
      <label>Số điện thoại người đặt<input id="deliveryQuotePhone" inputmode="tel" autocomplete="tel" maxlength="20" required></label>
      <button class="quote-button" id="deliveryQuoteLookupButton" type="submit">Tra cứu báo giá</button>
    </form>
    <div id="deliveryQuoteError" class="quote-error" hidden role="alert"></div>
    <section id="deliveryQuoteResult" class="quote-result" hidden aria-live="polite"></section>
  </main>
  <script type="module" src="./js/delivery-quote.js?v=20261115_manual_quote_v1"></script>
</body>
</html>
