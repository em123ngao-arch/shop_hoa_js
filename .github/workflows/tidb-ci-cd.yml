name: TiDB Cloud & Fullstack CI/CD Pipeline

on:
  push:
    branches: [ main, master, cautrucmoi, develop ]
  pull_request:
    branches: [ main, master, cautrucmoi, develop ]
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng nút "Run workflow" trên GitHub

jobs:
  tidb-sync-and-test:
    name: Sync TiDB Schema & Run Verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
      TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
      JWT_SECRET: "ci_cd_test_secret_for_automated_verification_at_least_64_characters_long_123456789"
      NODE_ENV: "test"

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Cài đặt các gói phụ thuộc (Dependencies)
        run: npm ci

      - name: 4. Tạo Prisma Client Engine
        run: npx prisma generate

      - name: 5. Tự động đồng bộ Schema & Metadata lên TiDB Cloud
        if: env.TIDB_DATABASE_URL != ''
        run: |
          echo "🔄 Đang thực thi DDL và chuẩn hóa Metadata lên TiDB Cloud..."
          node scripts/apply-tidb-migrations.js
          echo "✅ Đã đồng bộ cấu trúc bảng và dữ liệu phân loại lên TiDB Cloud thành công!"

      - name: 6. Chạy kiểm thử xác thực tự động
        if: env.TIDB_DATABASE_URL != ''
        run: |
          echo "🧪 Chạy bộ test tích hợp hệ thống xác thực..."
          node test-auth-http.js

